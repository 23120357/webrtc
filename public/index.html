<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Mesh Group Call</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Network Status Monitor */
        #status-board {
            background-color: #2d2d2d;
            border-left: 4px solid #00ff88;
            padding: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            border-radius: 4px;
            font-family: monospace;
        }

        #status-text {
            color: #00ff88;
            font-weight: bold;
        }

        /* Responsive Video Grid */
        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
        }

        video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #000;
            border-radius: 8px;
            border: 2px solid #444;
        }

        /* Highlight local video */
        #localVideo {
            border-color: #00aaff;
            transform: scaleX(-1); /* Mirror effect */
        }

        .controls {
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>WebRTC Mesh Room</h2>
        <p>Room ID: <span id="room-display">demo-room</span> | My ID: <span id="my-id-display">...</span></p>
    </div>

    <div id="status-board">
        <div>System State: <span id="status-text">Initializing...</span></div>
    </div>

    <div id="video-grid">
        <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div class="controls">
        <button onclick="hangUp()">Hang Up / Leave Room</button>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
